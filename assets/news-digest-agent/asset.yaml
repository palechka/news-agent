apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: news-digest-agent
  description: AI agent that fetches and summarizes the top 3 news of the day for any user-specified topic using an external news API and LLM-powered summarization.

provides:
  apis:
    - name: news-digest-agent
      kind: a2a
      ordId: customer.build:apiResource:news-digest-agent-990e2.news-digest-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
